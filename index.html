<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <header>

        </div>

    <main class="flex flex-col md:flex-row gap-4">

       
     
    

        <aside class="w-full md:w-1/3 bg-gray-500 overflow-x-auto md:overflow-y-auto md:max-h-screen"  >

              <div class="flex md:flex-col gap-3">

            <div class="flex-shrink-0 bg-white p-4">channel 2</div>
            <div class="flex-shrink-0 bg-white p-4">channel 3</div>
            <div class="flex-shrink-0 bg-white p-4">channel 4</div>
            <div class="flex-shrink-0 bg-white p-4">channel 5</div>
             <div class="flex-shrink-0 bg-white p-4">channel 6</div>
            <div class="flex-shrink-0 bg-white p-4">channel 7</div>
            <div class="flex-shrink-0 bg-white p-4">channel 8</div>
            <div class="flex-shrink-0 bg-white p-4">channel 9</div>
            <div class="flex-shrink-0 bg-white p-4">channel 10</div>
            
            

</div>
        </aside>

        <section class="w-full md:flex-1 bg-gray-300  p-4">
            <img class="h-64 object-cover rounded-lg" src="https://images.unsplash.com/photo-1560169897-fc0cdbdfa4d5?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="stream preview">

            <h2 class="font-bold">2M</h2>
       <p>is a Moroccan free-to-air television network. </p>

        </section>
    </main>

</html>

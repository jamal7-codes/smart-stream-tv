<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream TV</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-[#0B1020] text-[#F8FAFC] min-h-screen">

    <!-- header -->
    <header class="bg-[#151D33] border-b border-[#293550]">
        <div class="flex flex-col sm:flex-row items-center p-4 gap-4 ">
            <img class="w-10" src="iptv-stream.webp" alt="logo">

            <h1 class="font-bold text-xl whitespace-nowrap">
                Smart Stream
            </h1>

            <input id="search-input"
                class="w-full px-4 py-2 bg-[#202B45] text-white border border-[#35425F] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7C5CFC] placeholder-gray-400"
                type="text" placeholder="Search channels...">
        </div>
    </header>


    <main class="flex flex-col md:flex-row gap-4 p-4">

        <!-- aside -->
        <aside class="bg-[#151D33] w-full md:w-1/3 rounded-xl p-3 min-w-0">

            <!-- category -->
            <div class=" flex flex-wrap gap-3 mb-6">

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="All">All</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="DOCUMENTAIRE">Documentaire</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="SPORT">Sport</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="NATIONAL">National</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="DIVERTISSEMENT">Divertissement</button>

            </div>


            <div id="channel-list" class="overflow-y-auto mt-4 md:overflow-y-auto">



            </div>
        </aside>

        <!-- preview -->
        <section class="w-full md:flex-1 bg-[#151D33] p-4 rounded-xl">

            <div class="relative">

                <video id="preview-video" class="w-full aspect-video object-cover rounded-xl bg-black" controls
                    playsinline preload="metadata" aria-label="Selected channel video">
                    Your browser does not support HTML video.
                </video>
                <!-- <img id="preview-image" class="w-full aspect-video object-cover rounded-xl"
                    src=""
                    alt="Stream preview"> -->

                <span
                    class="absolute top-3 left-3 bg-[#20C997] text-[#0B1020] text-xs font-bold px-3 py-1 rounded-full">
                    LIVE
                </span>
            </div>

            <h2 id="preview-title" class="font-bold text-2xl mt-4">2M</h2>



        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
